name: ci

on:
  push:
    branches: [master, ci/cross-platform, feat/ios-m3a]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590 # main
      - uses: DeterminateSystems/magic-nix-cache-action@8941f279e15828abcd2fc8fbb7cd282ab00972a7 # main

      - name: cargo fmt --check
        run: nix develop --command cargo fmt --check

      - name: cargo clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: nix develop --command cargo test --locked

      - name: cargo audit
        run: nix shell nixpkgs#cargo-audit --command cargo audit --deny warnings

      - name: benchmark harness tests
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'

      - name: nix build (packages.default)
        run: nix build .#default --print-build-logs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: cargo test (lib)
        run: cargo test --lib --locked
      - name: cargo build (release bins)
        run: cargo build --release --locked --bins
      - name: check release binaries
        shell: pwsh
        run: |
          foreach ($f in 'target\release\wim.exe', 'target\release\shellswim.exe') {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wim-windows-x64-bins
          path: |
            target/release/wim.exe
            target/release/shellswim.exe
          retention-days: 7

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: install mpv
        run: brew install mpv
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo build
        run: cargo build --locked --bins
      - name: cargo test
        run: cargo test --locked
      - name: add x86_64-apple-darwin target
        run: rustup target add x86_64-apple-darwin
      - name: cargo build (x86_64-apple-darwin)
        run: cargo build --locked --target x86_64-apple-darwin --bins
      - name: mpv integration tests (non-blocking)
        continue-on-error: true
        run: 'cargo test --locked -- --ignored mpv::'

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: build core, bindings and xcframework
        run: ios/build-rust.sh
      - name: XCTest on an iPhone simulator
        working-directory: ios/WimCore
        run: |
          device=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed 's/^ *//; s/ (.*//')
          xcodebuild test -scheme WimCore-Package \
            -destination "platform=iOS Simulator,name=${device:-iPhone 16}" \
            CODE_SIGNING_ALLOWED=NO
      - name: build the app for the simulator
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          device=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed 's/^ *//; s/ (.*//')
          xcodebuild build -project Shellswim.xcodeproj -scheme Shellswim \
            -destination "platform=iOS Simulator,name=${device:-iPhone 16}" \
            CODE_SIGNING_ALLOWED=NO

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cross-platform-actions/action@30cde56b87a128507bebea9531205087890ee360 # v1.8.0
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '14.5'
          shell: sh
          run: |
            sudo pkg install -y rust mpv pkgconf
            cargo build --locked --bins
            cargo test --locked --lib
