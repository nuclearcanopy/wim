[package]
name = "wim"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "terminal omniplayer for music and video"

[lib]
name = "wim"
path = "src/lib.rs"

[[bin]]
name = "wim"
path = "src/main.rs"

[[bin]]
name = "shellswim"
path = "src/bin/shellswim/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ratatui-image = "4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
nucleo-matcher = "0.3"
ureq = { version = "2", features = ["json"] }
md-5 = "0.10"
rand = "0.8"
walkdir = "2"
unicode-width = "0.2"
lofty = "0.22"
strsim = "0.11"
base64 = "0.22"
zeroize = { version = "1.9.1", features = ["derive"] }
libc = "0.2.191"

[profile.release]
lto = false
codegen-units = 16
strip = true
incremental = true

[profile.ship]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
incremental = false

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2
